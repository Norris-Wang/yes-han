version: "1.0"
lessons:
  - id: L10
    title: 제10과 휴일과 방학
    order: 10
    topics:
      - id: T-L10-01
        title: 설악산에 가려고 해요
        turns:
          - speaker: 정회
            text: 웨이 씨, 방학이 언제예요?
            translation: 小伟，什么时候放假？
          - speaker: 웨이
            text: 6월 초에 수업이 끝나면 2주 동안 방학이에요.
            translation: 六月初课程结束后，会放两周假。
          - speaker: 정회
            text: 그래요? 웨이 씨는 뭘 하실 거예요?
            translation: 是吗？你准备做什么？
          - speaker: 웨이
            text: 이번 방학에는 설악산에 가려고 해요.
            translation: 这次假期我打算去雪岳山。
          - speaker: 정회
            text: 등산을 하실 거예요?
            translation: 你打算去登山吗？
          - speaker: 웨이
            text: 아니요, 이번에는 사진을 찍으러 가요.
            translation: 不是，这次我是去拍照的。
      - id: T-L10-02
        title: 시간이 있을 때는 여행을 가요
        turns:
          - speaker: 웨이
            text: 제 취미는 사진 찍기예요.
            translation: 我的爱好是摄影。
          - speaker: 정회
            text: 그래요? 뭘 찍는데요?
            translation: 是吗？你拍什么？
          - speaker: 웨이
            text: 주로 꽃을 찍어요. 정회 씨 취미는 뭐예요?
            translation: 主要拍花。正会，你有什么爱好？
          - speaker: 정회
            text: 시간이 있을 때는 여행을 가요. 그리고 영화 보는 것도 좋아해요.
            translation: 有时间就去旅行，也喜欢看电影。
          - speaker: 웨이
            text: 여행하신 곳 중에서 어디가 제일 좋았어요?
            translation: 去过的地方中，你最喜欢哪里？
          - speaker: 정회
            text: 저는 제주도가 제일 좋았어요.
            translation: 我最喜欢济州岛。
      - id: T-L10-03
        title: 극장에 자주 못 가요
        turns:
          - speaker: 정회
            text: 웨이 씨는 영화를 자주 보세요?
            translation: 小伟，你经常看电影吗？
          - speaker: 웨이
            text: 아니요, 바빠서 극장에 자주 못 가요. 한 달에 한 번쯤 가요.
            translation: 不，因为忙，我不常去电影院，大约一个月去一次。
          - speaker: 정회
            text: 어떤 영화를 좋아하세요?
            translation: 你喜欢什么电影？
          - speaker: 웨이
            text: 슬픈 영화를 좋아해요.
            translation: 我喜欢悲伤的电影。
          - speaker: 정회
            text: 주말에는 표 사기가 어렵지요?
            translation: 周末买票很难吧？
          - speaker: 웨이
            text: 네, 그런데 요즘에는 인터넷으로 예매할 수 있어서 편해요.
            translation: 是的，不过现在可以网上订票，很方便。
      - id: T-L10-04
        title: 산책을 하고 집에서 쉬었어요
        turns:
          - speaker: 정회
            text: 웨이 씨, 지난 주말에 뭘 하셨어요?
            translation: 小伟，上周末你做了什么？
          - speaker: 웨이
            text: 산책을 하고 집에서 쉬었어요. 정회 씨는 뭘 하셨어요?
            translation: 散了步，又在家休息。正会，你做了什么？
          - speaker: 정회
            text: 토요일에는 수영을 하고 일요일에는 탁구를 쳤어요.
            translation: 周六游泳，周日打乒乓球。
          - speaker: 웨이
            text: 주말마다 운동을 많이 하세요?
            translation: 你每个周末都经常运动吗？
          - speaker: 정회
            text: 탁구를 배우기 전에는 별로 많이 안 했어요.
            translation: 学乒乓球以前不怎么运动。
          - speaker: 웨이
            text: 탁구를 잘 치세요? 저는 잘 치지 못하는데 좀 가르쳐 주세요.
            translation: 你乒乓球打得好吗？我打得不好，能教教我吗？
