    grammars:
      - id: G-L10-01
        name: -(으)려고 하다
        function: 用于动词词干后，表示计划、打算或意图。元音结尾常用 -려고，收音结尾用 -으려고。
        examples:
          - sentence: 내일 대사관에 가려고 합니다.
            translation: 明天打算去大使馆。
            focus: 가려고 합니다
            cloze: 내일 대사관에 {가려고 합니다}.
            answer: 가려고 합니다
            choices:
              - 가으려고 합니다
              - 가려고 입니까
              - 가려려고 합니다
            dictionaryForm: 가다
            hint: 计划·意图
          - sentence: 오후 몇 시에 출발하려고 합니까?
            translation: 下午几点打算出发？
            focus: 출발하려고 합니까
            cloze: 오후 몇 시에 {출발하려고 합니까}?
            answer: 출발하려고 합니까
            choices:
              - 출발하으려고 합니까
              - 출발하려 합니까까
              - 출발하려고 입니까
            dictionaryForm: 출발하다
            hint: 计划·疑问
          - sentence: 도서관에 가서 책을 읽으려고 합니다.
            translation: 打算去图书馆读书。
            focus: 읽으려고 합니다
            cloze: 도서관에 가서 책을 {읽으려고 합니다}.
            answer: 읽으려고 합니다
            choices:
              - 읽려고 합니다
              - 읽으려고 입니까
              - 읽으려고 합니습니까
            dictionaryForm: 읽다
            hint: 计划·意图
          - sentence: 우리 아들은 의사가 되려고 합니다.
            translation: 我儿子打算当医生。
            focus: 되려고 합니다
            cloze: 우리 아들은 의사가 {되려고 합니다}.
            answer: 되려고 합니다
            choices:
              - 되으려고 합니까
              - 되는려고 합니까
              - 되려고 입니까
            dictionaryForm: 되다
            hint: 计划·意图
          - sentence: 김밥을 만들려고 합니다.
            translation: 打算做紫菜包饭。
            focus: 만들려고 합니다
            cloze: 김밥을 {만들려고 합니다}.
            answer: 만들려고 합니다
            choices:
              - 만들으려고 합니다
              - 만드는려고 합니다
              - 만들려고 입니까
            dictionaryForm: 만들다
            hint: 计划·意图
      - id: G-L10-02
        name: 동안
        function: 接在时间段名词后，表示在某段时间期间。
        examples:
          - sentence: 1년 동안 한국말을 배웠어요.
            translation: 学了一年韩语。
            focus: 동안
            cloze: 1년 {동안} 한국말을 배웠어요.
            answer: 동안
            choices:
              - 전에
              - 후에
              - 부터
            hint: 持续时间
          - sentence: 사흘 동안에 생각이 달라졌어요.
            translation: 三天里想法改变了。
            focus: 동안에
            cloze: 사흘 {동안에} 생각이 달라졌어요.
            answer: 동안에
            accept:
              - 동안
            choices:
              - 전에
              - 후에
              - 부터
            hint: 一段时间内
          - sentence: 얼마 동안 운동을 하실 거예요?
            translation: 您准备运动多长时间？
            focus: 동안
            cloze: 얼마 {동안} 운동을 하실 거예요?
            answer: 동안
            choices:
              - 전에
              - 후에
              - 부터
            hint: 持续时间
          - sentence: 방학 동안 여행을 많이 하고 싶어요.
            translation: 假期里想多旅行。
            focus: 동안
            cloze: 방학 {동안} 여행을 많이 하고 싶어요.
            answer: 동안
            choices:
              - 전에
              - 후에
              - 부터
            hint: 持续时间
          - sentence: 몇 달 동안 친구를 못 만났어요.
            translation: 几个月都没见到朋友了。
            focus: 동안
            cloze: 몇 달 {동안} 친구를 못 만났어요.
            answer: 동안
            choices:
              - 전에
              - 후에
              - 부터
            hint: 持续时间
      - id: G-L10-03
        name: 을/ㄹ 때
        function: 表示动作发生的时间，用于谓词词干和体词谓词形后。过去时为“-었/았/했을 때”。名词后用“때”，如 점심 때, 시험 때, 방학 때。
        examples:
          - sentence: 저녁을 먹을 때 손님이 오셨어요.
            translation: 吃晚饭的时候客人来了。
            focus: 먹을 때
            cloze: 저녁을 {먹을 때} 손님이 오셨어요.
            answer: 먹을 때
            choices:
              - 먹는을 때
              - 먹을에 때
              - 먹으을 때
            dictionaryForm: 먹다
            hint: 动作发生时
          - sentence: 버스를 탈 때 조심하세요.
            translation: 坐公交车时请小心。
            focus: 탈 때
            cloze: 버스를 {탈 때} 조심하세요.
            answer: 탈 때
            choices:
              - 타을 때
              - 타는을 때
              - 탄을 때
            dictionaryForm: 타다
            hint: 动作发生时
          - sentence: 공항에 도착했을 때는 밤이었어요.
            translation: 到达机场的时候已经是夜里了。
            focus: 도착했을 때
            cloze: 공항에 {도착했을 때}는 밤이었어요.
            answer: 도착했을 때
            choices:
              - 도착한을 때
              - 도착했는을 때
              - 도착했때
            dictionaryForm: 도착하다
            hint: 过去某时
          - sentence: 점심 때 전화해 주세요.
            translation: 午饭时间请打电话。
            focus: 때
            cloze: 점심 {때} 전화해 주세요.
            answer: 때
            choices:
              - 마다
              - 부터
              - 까지
            hint: 名词后·时间
          - sentence: 시험 때는 긴장하지 마세요.
            translation: 考试时不要紧张。
            focus: 때는
