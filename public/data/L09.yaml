    grammars:
      - id: G-L09-01
        name: 는데, 은데/ㄴ데
        function: 连接词尾，表示对立、转折，用于谓词词干和体词谓词形后。动词词干后用“는데”，形容词词干后用“은데/ㄴ데”，体词谓词形后用“ㄴ데”。“있다/없다”结尾的词用“는데”。
        examples:
          - sentence: 저는 농구를 좋아하는데 친구들은 야구를 좋아합니다.
            translation: 我喜欢篮球，而朋友们喜欢棒球。
            focus: 좋아하는데
            cloze: 저는 농구를 {좋아하는데} 친구들은 야구를 좋아합니다.
            answer: 좋아하는데
            choices:
              - 좋아하은데
              - 좋아한데
              - 좋아합데
            dictionaryForm: 좋아하다
            hint: 背景与对比
          - sentence: 서울은 복잡한데 여기는 그렇지 않군요.
            translation: 首尔很拥挤，而这里并非如此。
            focus: 복잡한데
            cloze: 서울은 {복잡한데} 여기는 그렇지 않군요.
            answer: 복잡한데
            choices:
              - 복잡는데
              - 복잡은데
              - 복잡데
            dictionaryForm: 복잡하다
            hint: 对比
          - sentence: 저는 영화를 보고 싶은데 친구들은 연극을 보고 싶어해요.
            translation: 我想看电影，朋友们却想看话剧。
            focus: 싶은데
            cloze: 저는 영화를 보고 {싶은데} 친구들은 연극을 보고 싶어해요.
            answer: 싶은데
            choices:
              - 싶는데
              - 싶ㄴ데
              - 싶데
            dictionaryForm: 싶다
            hint: 对比
          - sentence: 내일 시험을 보는데 공부하기가 싫어요.
            translation: 明天有考试，可我不想学习。
            focus: 보는데
            cloze: 내일 시험을 {보는데} 공부하기가 싫어요.
            answer: 보는데
            choices:
              - 보은데
              - 보ㄴ데
              - 보데
            dictionaryForm: 보다
            hint: 背景与转折
          - sentence: 친구는 많은데 이야기할 사람이 없어요.
            translation: 朋友很多，却没有人可以倾诉。
            focus: 많은데
            cloze: 친구는 {많은데} 이야기할 사람이 없어요.
            answer: 많은데
            choices:
              - 많는데
              - 많ㄴ데
              - 많데
            dictionaryForm: 많다
            hint: 对比
      - id: G-L09-02
        name: 을/ㄹ 수 있다
        function: 表示有做某事的能力或有某种可能性，与谓词词干和体词谓词形连用。
        examples:
          - sentence: 나도 한국말을 할 수 있습니다.
            translation: 我也会说韩语。
            focus: 할 수 있습니다
            cloze: 나도 한국말을 {할 수 있습니다}.
            answer: 할 수 있습니다
            choices:
              - 하는 수 있습니다
              - 한 수 있습니다
              - 할 수 입니까
            dictionaryForm: 하다
            hint: 能力
          - sentence: 내일은 한가하니까 갈 수 있어요.
            translation: 明天有空，所以可以去。
            focus: 갈 수 있어요
            cloze: 내일은 한가하니까 {갈 수 있어요}.
            answer: 갈 수 있어요
            choices:
              - 가는 수 있어요
              - 간 수 있어요
              - 갈 수 입니다
            dictionaryForm: 가다
            hint: 可能性
          - sentence: 여기서 좌회전을 할 수 있습니까?
            translation: 能在这里左转吗？
            focus: 할 수 있습니까
            cloze: 여기서 좌회전을 {할 수 있습니까}?
            answer: 할 수 있습니까
            choices:
              - 한 수 있습니까
              - 하는 수 있습니까
              - 할 수 입니까
            dictionaryForm: 하다
            hint: 能力·疑问
          - sentence: 한국 신문은 어려워서 읽을 수 없습니다.
            translation: 韩国报纸很难，所以读不懂。
            focus: 읽을 수 없습니다
            cloze: 한국 신문은 어려워서 {읽을 수 없습니다}.
            answer: 읽을 수 없습니다
            choices:
              - 읽는 수 없습니다
              - 읽은 수 없습니다
              - 읽을 수 아닙니다
            dictionaryForm: 읽다
            hint: 不能
          - sentence: 길이 복잡해서 운전할 수 없습니다.
            translation: 道路太复杂，无法开车。
            focus: 운전할 수 없습니다
            cloze: 길이 복잡해서 {운전할 수 없습니다}.
            answer: 운전할 수 없습니다
            choices:
              - 운전한 수 없습니다
              - 운전하는 수 없습니다
              - 운전할 수 아닙니다
            dictionaryForm: 운전하다
            hint: 不能
      - id: G-L09-03
        name: (은/ㄴ) 후에
        function: 表示“之后”，用于动词词干或体词后。动词后加“은/ㄴ”，体词后不加。
        examples:
          - sentence: 식사한 후에 차를 마십니다.
            translation: 吃过饭以后喝茶。
            focus: 식사한 후에
            cloze: "{식사한 후에} 차를 마십니다."
            answer: 식사한 후에
            choices:
              - 식사하는 후에
              - 식사할 후에
              - 식사하은 후에
            dictionaryForm: 식사하다
            hint: 动作之后
          - sentence: 내 말을 들은 후에 질문하세요.
            translation: 听完我说的话再提问。
            focus: 들은 후에
            cloze: 내 말을 {들은 후에} 질문하세요.
            answer: 들은 후에
            choices:
              - 듣은 후에
              - 들는 후에
              - 듣는 후에
            dictionaryForm: 듣다
            hint: 动作之后
          - sentence: 학교를 졸업한 후에 뭘 하시겠어요?
            translation: 学校毕业后您打算做什么？
            focus: 졸업한 후에
            cloze: 학교를 {졸업한 후에} 뭘 하시겠어요?
            answer: 졸업한 후에
            choices:
              - 졸업하는 후에
              - 졸업하은 후에
              - 졸업할 후에
            dictionaryForm: 졸업하다
            hint: 动作之后
          - sentence: 30분 후에 다시 걸겠습니다.
            translation: 三十分钟后再打电话。
            focus: 후에
            cloze: 30분 {후에} 다시 걸겠습니다.
            answer: 후에
            choices:
              - 후를
              - 후가
              - 후에서
            hint: 时间之后
          - sentence: 퇴근 후에 한잔합니다.
            translation: 下班后喝一杯。
            focus: 후에
            cloze: 퇴근 {후에} 한잔합니다.
            answer: 후에
            choices:
              - 후를
              - 후가
              - 후에서
            hint: 时间之后
          - sentence: 일 년 후에 결혼하겠어요.
            translation: 一年后打算结婚。
            focus: 후에
            cloze: 일 년 {후에} 결혼하겠어요.
            answer: 후에
            choices:
              - 후를
              - 후가
              - 후에서
            hint: 时间之后
      - id: G-L09-04
        name: -겠-
        function: 表示推测，用于谓词词干和体词谓词形后。
        examples:
          - sentence: 제목을 보니까 이 영화가 재미있겠어요.
            translation: 看标题，这部电影应该很有趣。
            focus: 재미있겠어요
            cloze: 제목을 보니까 이 영화가 {재미있겠어요}.
            answer: 재미있겠어요
            choices:
              - 재미있겄어요
              - 재미있는겠어요
              - 재미있겠은요
            dictionaryForm: 재미있다
            hint: 推测
          - sentence: 주말이라서 교통이 복잡하겠어요.
            translation: 因为是周末，交通应该很拥挤。
            focus: 복잡하겠어요
            cloze: 주말이라서 교통이 {복잡하겠어요}.
            answer: 복잡하겠어요
            choices:
