version: "1.0"
lessons:
  - id: L09
    title: 제9과 날씨와 계절
    order: 9
    topics:
      - id: T-L09-01
        title: 저는 스키를 탈 수 있는 겨울이 좋아요
        turns:
          - speaker: 미선
            text: 저는 봄을 좋아하는데 제임스 씨는 어떤 계절을 좋아하세요?
            translation: 我喜欢春天，詹姆斯先生喜欢哪个季节呢？
          - speaker: 제임스
            text: 저는 스키를 탈 수 있는 겨울이 좋아요.
            translation: 我喜欢能够滑雪的冬天。
          - speaker: 미선
            text: 스키를 좋아하세요?
            translation: 您喜欢滑雪吗？
          - speaker: 제임스
            text: 네, 겨울이 되면 스키장에 자주 가요.
            translation: 是的，一到冬天我就经常去滑雪场。
          - speaker: 미선
            text: 그럼 이번 겨울에는 같이 스키장에 갈까요?
            translation: 那今年冬天一起去滑雪场好吗？
          - speaker: 제임스
            text: 아, 그럼 좋은 생각이에요.
            translation: 啊，那是个好主意。
      - id: T-L09-02
        title: 날씨가 조금 흐린데요
        turns:
          - speaker: 미선
            text: 오늘 날씨가 좀 흐린데요.
            translation: 今天天气有点阴。
          - speaker: 제임스
            text: 네, 하늘에 구름이 좀 꼈어요.
            translation: 是的，天上有些云。
          - speaker: 미선
            text: 바람도 좀 부는데요.
            translation: 风也有点大呢。
          - speaker: 제임스
            text: 아마 저녁에는 비가 올 거예요.
            translation: 晚上大概会下雨。
          - speaker: 미선
            text: 비가 온 후에는 날씨가 맑겠지요?
            translation: 下过雨后天气会放晴吧？
          - speaker: 제임스
            text: 네, 내일은 맑을 거예요.
            translation: 嗯，明天会晴的。
      - id: T-L09-03
        title: 오늘보다 따뜻할 것 같아요
        turns:
          - speaker: 제임스
            text: 내일은 날씨가 어떨까요?
            translation: 明天天气会怎么样呢？
          - speaker: 미선
            text: 오늘보다 따뜻할 것 같아요.
            translation: 我觉得会比今天暖和。
          - speaker: 제임스
            text: 미선 씨 고향은 겨울에 날씨가 어때요?
            translation: 美善，你家乡冬天的天气怎么样？
          - speaker: 미선
            text: 남쪽이니까 서울보다 따뜻해요.
            translation: 因为在南方，所以比首尔暖和。
          - speaker: 제임스
            text: 여름에는 날씨가 어때요? 더워요?
            translation: 那夏天天气怎么样？热吗？
          - speaker: 미선
            text: 네, 덥고 비가 많이 와요.
            translation: 是的，很热，而且雨下得很多。
      - id: T-L09-04
        title: 저기에서 사람들이 운동을 하고 있어요
        turns:
          - speaker: 제임스
            text: 봄이 되니까 산책하는 사람이 많군요.
            translation: 春天到了，散步的人真多啊。
          - speaker: 미선
            text: 저기에서 사람들이 운동을 하고 있어요.
            translation: 那边有人正在运动。
          - speaker: 제임스
            text: 미선 씨는 무슨 운동을 자주 하세요?
            translation: 美善，你经常做什么运动？
          - speaker: 미선
            text: 봄에는 등산을 하고 여름에는 수영을 해요.
            translation: 春天爬山，夏天游泳。
          - speaker: 제임스
            text: 한국 사람들은 등산을 참 좋아하는 것 같아요.
            translation: 韩国人好像真的很喜欢登山。
          - speaker: 미선
            text: 산이 많아서 그럴 거예요.
            translation: 大概是因为山多吧。
